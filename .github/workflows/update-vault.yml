name: Update vault submodule

on:
  schedule:
    - cron: "0 13 * * *"   # daily at 13:00 UTC — adjust as you like
  workflow_dispatch:        # lets you trigger it manually from the Actions tab too

permissions:
  contents: write

jobs:
  update-submodule:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Pull latest vault commit
        run: git submodule update --remote vault

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add vault
          if git diff --cached --quiet; then
            echo "No submodule changes to commit."
          else
            git commit -m "Auto-update vault submodule"
            git push
          fi